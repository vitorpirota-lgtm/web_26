<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1> Pesquisa de Sastifação do Cliente:</h1>
<form action="" method="get">
    <label>
        Nome:
        <input name="form_nome" type="text" placeholder="Ex: Vitor" required
    </label>
    <br>
    <br>

    Nome da Empresa:
    <input name="form_empresa" type="text" placeholder="Ex: Ajinomoto" required
    </label>
    <br>
    <br>

    Idade:
    <br>
    <input name="form_idade" value="1" type="radio" required>
    10-20 anos
    </label>
    <br>

    <label>
        <input name="form_idade" value="1" type="radio" required>
        20-30 anos
    </label>
    <br>

    <label>
        <input name="form_idade" value="1" type="radio" required>
        30-50 anos
        <br>

        <label>
            <input name="form_idade" value="1" type="radio" required>
            50-80 anos
            <br>
            <br>

            Email:
            <input name="form_email" type="email" placeholder="Ex: vitinho.gameplay@gmail.com" required
        </label>
        <br>
        <br>

        <label>
            Telefone comercial:
            <input name="form_telefone" type="tel" required>
        </label>

        <label>
            Celular:
            <input name="form_celular" type="tel" required>
        </label>
        <br>
        <br>

        Como vc avalia os nossos serviços atualmente?
        <br>
        <label>
            <input name="form_sastifacao" value="1" type="radio" required>
            REGULAR
        </label>
        <br>

        <label>
            <input name="form_sastifacao" value="1" type="radio" required>
            BOM
        </label>
        <br>

        <label>
            <input name="form_sastifacao" value="1" type="radio" required>
            EXCELENTE
            <br>

            Como vc avalia os nossos serviços da area operacional?
            <br>
            <label>
                <input name="form_avalicao" value="1" type="radio" required>
                REGULAR
            </label>
            <br>

            <label>
                <input name="form_avalicao" value="1" type="radio" required>
                BOM
            </label>
            <br>

            <label>
                <input name="form_avalicao" value="1" type="radio" required>
                EXCELENTE
                <br>

                Qual o nivel de satisfação com o atendimento administrativo quando você precisa?
                <br>
                <label>
                    <input name="form_nivel" value="1" type="radio" required>
                    POUCO SATISFATÓRIO
                </label>
                <br>

                <label>
                    <input name="form_nivel" value="1" type="radio" required>
                    SATISFATÓRIO
                </label>
                <br>

                <label>
                    <input name="form_nivel" value="1" type="radio" required>
                    MUITO SATISFATÓRIO
                    <br>

                    Os profissionais lhe atendem de forma satisfatória?
                    <br>
                    <label>
                        <input name="form_atendimento" value="1" type="radio" required>
                        SIM
                    </label>
                    <br>

                    <label>
                        <input name="form_atendimento" value="1" type="radio" required>
                        NÂO
                    </label>
                    <br>

                    Você tem alguma sugestão ou crítica a fazer para cada vez mais melhorarmos nossos serviços?
                    <br>
                    <textarea name="form_descricao" rows="5" cols="50" required></textarea>
                </label>
                <br>
                <br>

                <button type="submit">Enviar Pesquisa</button>
                <button type="reset">Redefinir Pesquisa</button>
</body>
</html>
