<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1> Enviar Email </h1>

<!-- O metodo deve ser post -->
<form action="" method="get">
<!--  Exemplo 1 de um label e input  -->

    <label>
        Nome:
    <input name="form_nome" type="text" placeholder="Ex: Vitor" required
    </label>
    <br>
    <br>

  <label>
        Email:
    <input name="form_email" type="email" placeholder="Ex: vitinho.gameplay@gmail.com" required
    </label>
    <br>
    <br>

  <label>
        Assunto:
    <input name="form_assunto" type="text" placeholder="Ex: Escola "
    </label>
    <br>
    <br>

  <label>
        Mensagem:
    <textarea name="form_mensagem" rows="10" cols="50"></textarea>
    </label>
  <br>
  <br>


<button type="submit">Enviar</button>
    <button type="reset">Redefinir</button>





</body>
</html>
